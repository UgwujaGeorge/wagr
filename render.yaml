services:
  - type: web
    name: wagr-relayer
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build -w @wagr/shared && npm run build -w @wagr/relayer
    startCommand: bash relayer/start.sh
    healthCheckPath: /health
    envVars:
      # NODE_ENV is deliberately not set here. Render applies service env vars
      # during the build, and NODE_ENV=production makes `npm ci` skip
      # devDependencies, which drops the typescript/@types/node needed to
      # compile. relayer/start.sh exports it at runtime instead.
      - key: BASE_SEPOLIA_RPC_URL
        value: https://sepolia.base.org
      - key: BASE_MAINNET_RPC_URL
        value: https://mainnet.base.org
      - key: BASE_SEPOLIA_ESCROW_ADDRESS
        value: 0x1854520Dbc6BE60e5298c4e5d13a8DdC08f91656
      - key: BASE_MAINNET_ESCROW_ADDRESS
        value: 0x602d022B9E9c415F399F77d5be69404F2219dc99
      - key: GENLAYER_NETWORK
        value: studionet
      - key: GENLAYER_RPC_URL
        value: https://studio.genlayer.com/api
      - key: GENLAYER_EXPLORER_URL
        value: https://explorer-studio.genlayer.com
      - key: GENLAYER_RESOLVER_ADDRESS
        value: 0xa7976eAc9eE972C371b01B085D365Cea09d84DaD
      # Must match the escrow's authorized resolver address. Set per environment.
      - key: RELAYER_PRIVATE_KEY
        sync: false
